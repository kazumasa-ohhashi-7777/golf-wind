<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⛳ Green Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink:    #080f09;
  --green:  #2a6e3f;
  --gold:   #c8a040;
  --danger: #d84040;
  --safe:   #48b888;
  --white:  #e8f0eb;
  --muted:  #607870;
  --panel:  rgba(6,14,8,0.96);
  --border: rgba(200,160,64,0.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
body { font-family: 'Noto Sans JP', sans-serif; color: var(--white); display: flex; flex-direction: column; align-items: center; }

header {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  background: var(--panel); z-index: 10; flex-shrink: 0;
}
.logo { font-family:'Teko',sans-serif; font-size:22px; letter-spacing:3px; color:var(--gold); }
.hole-info { font-size:11px; color:var(--muted); text-align:right; line-height:1.5; }

#canvas { display: block; touch-action: none; flex-shrink: 0; }

.slope-bar {
  width: 100%; display: flex; gap: 6px; padding: 8px 12px;
  background: var(--panel); border-bottom: 1px solid var(--border);
  flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
}
.slope-bar::-webkit-scrollbar { display: none; }
.slope-btn {
  flex-shrink: 0; padding: 5px 12px; border: 1px solid var(--border);
  border-radius: 20px; background: none; color: var(--muted);
  font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.slope-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(200,160,64,0.1); }

.bottom {
  width: 100%; flex: 1; display: flex; flex-direction: column;
  justify-content: space-between; padding: 10px 14px 14px;
  background: var(--panel); border-top: 1px solid var(--border); gap: 10px; overflow: hidden;
}

.status-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.status-text { font-size: 12px; color: var(--muted); line-height: 1.5; flex: 1; }
.status-badge {
  font-family: 'Teko', sans-serif; font-size: 15px; padding: 3px 12px;
  border-radius: 20px; letter-spacing: 1px; flex-shrink: 0;
}
.badge-ready  { background: rgba(72,184,136,0.15); color: var(--safe);   border: 1px solid rgba(72,184,136,0.3); }
.badge-aim    { background: rgba(200,160,64,0.15);  color: var(--gold);  border: 1px solid rgba(200,160,64,0.3); }
.badge-roll   { background: rgba(106,184,212,0.15); color: #6ab8d4;      border: 1px solid rgba(106,184,212,0.3); }
.badge-out    { background: rgba(216,64,64,0.15);   color: var(--danger);border: 1px solid rgba(216,64,64,0.3); }

.power-wrap { display: flex; flex-direction: column; gap: 5px; }
.power-header { display: flex; justify-content: space-between; }
.power-label { font-size: 11px; color: var(--muted); }
.power-val { font-family:'Teko',sans-serif; font-size:18px; color: var(--gold); }
.power-track { width: 100%; height: 10px; background: rgba(255,255,255,0.07); border-radius: 5px; overflow: hidden; }
.power-fill {
  height: 100%; border-radius: 5px; width: 0%;
  background: linear-gradient(90deg, var(--safe), var(--gold), var(--danger));
  transition: width 0.05s;
}

.btn-row { display: flex; gap: 8px; }
.btn-sm {
  flex: 1; padding: 11px; border-radius: 10px;
  font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 700;
  cursor: pointer; background: rgba(255,255,255,0.06); color: var(--muted);
  border: 1px solid var(--border);
}
.btn-reset { background: rgba(200,160,64,0.1); color: var(--gold); border-color: rgba(200,160,64,0.3); }

#cupIn {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.78); z-index: 100;
  align-items: center; justify-content: center; flex-direction: column; gap: 16px;
}
#cupIn.show { display: flex; }
.cupin-emoji { font-size: 72px; animation: bounce 0.4s ease infinite alternate; }
@keyframes bounce { from{transform:scale(1)} to{transform:scale(1.15)} }
.cupin-text { font-family:'Teko',sans-serif; font-size:36px; letter-spacing:4px; color:var(--gold); }
.cupin-sub { font-size:13px; color:var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">⛳ GREEN SIM</div>
  <div class="hole-info" id="holeInfo">傾斜を選んでください</div>
</header>

<div class="slope-bar" id="slopeBar"></div>

<canvas id="canvas"></canvas>

<div class="bottom">
  <div class="status-row">
    <div class="status-text" id="statusText">①傾斜を選ぶ　②グリーンをタップしてボール配置　③ボールをドラッグして離すと発射</div>
    <div class="status-badge badge-ready" id="statusBadge">READY</div>
  </div>

  <div class="power-wrap">
    <div class="power-header">
      <span class="power-label">パワー</span>
      <span class="power-val" id="powerVal">---</span>
    </div>
    <div class="power-track"><div class="power-fill" id="powerFill"></div></div>
  </div>

  <div class="btn-row">
    <button class="btn-sm btn-reset" onclick="resetAll()">🔄 リセット</button>
    <button class="btn-sm" onclick="randomCup()">📍 ピン移動</button>
  </div>
</div>

<div id="cupIn">
  <div class="cupin-emoji">⛳</div>
  <div class="cupin-text">HOLE IN !</div>
  <div class="cupin-sub">タップして続ける</div>
</div>

<script>
const SLOPES = [
  { label:'フラット',    sx:0,      sy:0      },
  { label:'奥→手前↓',  sx:0,      sy:0.022  },
  { label:'手前→奥↑',  sx:0,      sy:-0.022 },
  { label:'左→右→',    sx:-0.020, sy:0      },
  { label:'右→左←',    sx:0.020,  sy:0      },
  { label:'左奥↘',      sx:-0.015, sy:0.015  },
  { label:'右奥↙',      sx:0.015,  sy:0.015  },
  { label:'複合（難）',  sx:-0.013, sy:0.020  },
];

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

let W, H, GW, GH, GX, GY;
let slopeX = 0, slopeY = 0;
let ball  = null;
let cup   = null;
let trail = [];

let dragging  = false;
let dragStart = null;
let dragNow   = null;
const MAX_DRAG = 100;

let rolling = false;
let phase   = 'place';

function resize(){
  const dpr     = window.devicePixelRatio || 1;
  const headerH = document.querySelector('header').offsetHeight;
  const slopeH  = document.querySelector('.slope-bar').offsetHeight;
  const bottomH = document.querySelector('.bottom').offsetHeight;
  const canvasH = window.innerHeight - headerH - slopeH - bottomH;
  const canvasW = window.innerWidth;
  canvas.style.width  = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  canvas.width  = canvasW * dpr;
  canvas.height = canvasH * dpr;
  ctx.scale(dpr, dpr);
  W = canvasW; H = canvasH;
  const pad = Math.min(W, H) * 0.08;
  GX = pad; GY = pad; GW = W - pad*2; GH = H - pad*2;
  if(!cup) cup = { x: GX+GW*0.5, y: GY+GH*0.25 };
}
window.addEventListener('resize', resize);

(function(){
  const bar = document.getElementById('slopeBar');
  SLOPES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'slope-btn' + (i === 0 ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => {
      document.querySelectorAll('.slope-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      slopeX = s.sx; slopeY = s.sy;
      resetAll();
      document.getElementById('holeInfo').textContent = '傾斜: ' + s.label;
    };
    bar.appendChild(btn);
  });
})();

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return { x: src.clientX - rect.left, y: src.clientY - rect.top };
}

function inGreen(x, y){
  const cx=(x-(GX+GW/2))/(GW/2), cy=(y-(GY+GH/2))/(GH/2);
  return cx*cx+cy*cy <= 0.92;
}

function onDown(e){
  e.preventDefault();
  if(rolling) return;
  const pos = getPos(e);

  if(phase === 'place'){
    if(!inGreen(pos.x, pos.y)) return;
    ball  = { x:pos.x, y:pos.y, vx:0, vy:0 };
    trail = [];
    phase = 'aim';
    dragging  = true;
    dragStart = { x:pos.x, y:pos.y };
    dragNow   = { x:pos.x, y:pos.y };
    setStatus('aim','ドラッグして方向と強さを決めて → 離すと発射！');
    return;
  }

  if(phase === 'aim' || phase === 'done'){
    if(!ball) return;
    const dx=pos.x-ball.x, dy=pos.y-ball.y;
    if(Math.sqrt(dx*dx+dy*dy) < 30){
      dragging  = true;
      dragStart = { x:ball.x, y:ball.y };
      dragNow   = { x:pos.x, y:pos.y };
      phase     = 'aim';
      trail     = [];
      setStatus('aim','ドラッグして方向と強さを決めて → 離すと発射！');
    }
  }
}

function onMove(e){
  e.preventDefault();
  if(!dragging || !dragStart) return;
  dragNow = getPos(e);
  const dx=dragNow.x-dragStart.x, dy=dragNow.y-dragStart.y;
  const dist=Math.min(Math.sqrt(dx*dx+dy*dy), MAX_DRAG);
  const pct=dist/MAX_DRAG;
  updatePowerUI(pct);
}

function onUp(e){
  e.preventDefault();
  if(!dragging || !dragStart || !dragNow) return;
  dragging = false;
  if(phase !== 'aim') return;

  // 修正：ドラッグした方向にボールが進む
  const dx = dragNow.x - dragStart.x;
  const dy = dragNow.y - dragStart.y;
  const dist = Math.sqrt(dx*dx+dy*dy);

  if(dist < 5){ dragStart=null; dragNow=null; return; }

  const clampedDist = Math.min(dist, MAX_DRAG);
  const power = (clampedDist / MAX_DRAG) * 4.0;
  const nx = dx/dist, ny = dy/dist;

  dragStart=null; dragNow=null;
  startRoll(nx * power, ny * power);
}

canvas.addEventListener('touchstart', onDown, { passive:false });
canvas.addEventListener('touchmove',  onMove, { passive:false });
canvas.addEventListener('touchend',   onUp,   { passive:false });
canvas.addEventListener('mousedown',  onDown);
canvas.addEventListener('mousemove',  onMove);
canvas.addEventListener('mouseup',    onUp);

function updatePowerUI(pct){
  const labels=['','弱','弱め','普通','強め','強','強!!','MAX!!'];
  const idx=Math.min(Math.floor(pct*7)+1,7);
  document.getElementById('powerFill').style.width=(pct*100)+'%';
  document.getElementById('powerVal').textContent=labels[idx];
}

let lastTime = 0;
function rollStep(ts){
  if(!rolling||!ball) return;
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  const friction=0.978;
  ball.vx=(ball.vx+slopeX*9.8*dt)*friction;
  ball.vy=(ball.vy+slopeY*9.8*dt)*friction;
  ball.x+=ball.vx*72*dt;
  ball.y+=ball.vy*72*dt;
  trail.push({x:ball.x,y:ball.y});
  if(trail.length>300) trail.shift();
  if(cup){
    const dx=ball.x-cup.x,dy=ball.y-cup.y;
    if(Math.sqrt(dx*dx+dy*dy)<6){rolling=false;phase='done';showCupIn();return;}
  }
  const gcx=GX+GW/2,gcy=GY+GH/2;
  const ex=(ball.x-gcx)/(GW/2),ey=(ball.y-gcy)/(GH/2);
  if(ex*ex+ey*ey>1.05){rolling=false;phase='done';setStatus('out','グリーンを外れました！もう一度狙って');return;}
  const speed=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
  if(speed<0.012){rolling=false;phase='done';setStatus('out','届きませんでした。もっと強く引いて！');return;}
  requestAnimationFrame(rollStep);
}

function startRoll(vx,vy){
  if(!ball||rolling) return;
  ball.vx=vx;ball.vy=vy;rolling=true;phase='rolling';
  setStatus('roll','転がり中...');
  document.getElementById('powerFill').style.width='0%';
  document.getElementById('powerVal').textContent='---';
  lastTime=performance.now();
  requestAnimationFrame(rollStep);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a140c';ctx.fillRect(0,0,W,H);
  drawGreen();drawSlopeArrows();drawTrail();drawCup();
  if(ball) drawBall();
  if(dragging&&dragStart&&dragNow) drawAimLine();
  requestAnimationFrame(draw);
}

function drawGreen(){
  const cx=GX+GW/2,cy=GY+GH/2,rx=GW/2,ry=GH/2;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=18;ctx.shadowOffsetY=6;
  const grad=ctx.createRadialGradient(cx,cy-ry*0.2,0,cx,cy,Math.max(rx,ry));
  grad.addColorStop(0,'#3d9658');grad.addColorStop(0.6,'#2d7a44');grad.addColorStop(1,'#1e5230');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();
  ctx.save();
  ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.clip();
  for(let x=GX;x<GX+GW;x+=14){
    ctx.strokeStyle='rgba(255,255,255,0.022)';ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(x,GY);ctx.lineTo(x,GY+GH);ctx.stroke();
  }
  ctx.restore();
}

function drawSlopeArrows(){
  if(slopeX===0&&slopeY===0) return;
  const cx=GX+GW/2,cy=GY+GH/2;
  const mag=Math.sqrt(slopeX*slopeX+slopeY*slopeY);
  const nx=slopeX/mag,ny=slopeY/mag;
  const step=55;
  for(let c=0;c*step<GW+step;c++){
    for(let r=0;r*step<GH+step;r++){
      const ax=GX+c*step+step/2,ay=GY+r*step+step/2;
      const dx=(ax-cx)/(GW/2),dy=(ay-cy)/(GH/2);
      if(dx*dx+dy*dy>0.82) continue;
      const len=15,ex=ax+nx*len,ey=ay+ny*len;
      ctx.save();ctx.globalAlpha=0.2;ctx.strokeStyle='#fff';ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ex,ey);ctx.stroke();
      const angle=Math.atan2(ey-ay,ex-ax);
      ctx.beginPath();
      ctx.moveTo(ex,ey);
      ctx.lineTo(ex-6*Math.cos(angle-0.4),ey-6*Math.sin(angle-0.4));
      ctx.lineTo(ex-6*Math.cos(angle+0.4),ey-6*Math.sin(angle+0.4));
      ctx.closePath();ctx.fillStyle='#fff';ctx.fill();
      ctx.restore();
    }
  }
}

function drawTrail(){
  if(trail.length<2) return;
  ctx.save();
  for(let i=1;i<trail.length;i++){
    ctx.globalAlpha=(i/trail.length)*0.6;
    ctx.strokeStyle='#c8a040';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();
  }
  ctx.restore();
}

function drawCup(){
  if(!cup) return;
  ctx.save();
  ctx.beginPath();ctx.arc(cup.x,cup.y,11,0,Math.PI*2);
  ctx.fillStyle='#040b05';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.strokeStyle='#e8f0eb';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cup.x,cup.y);ctx.lineTo(cup.x,cup.y-32);ctx.stroke();
  ctx.fillStyle='#d84040';
  ctx.beginPath();ctx.moveTo(cup.x,cup.y-32);ctx.lineTo(cup.x+16,cup.y-24);ctx.lineTo(cup.x,cup.y-16);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawBall(){
  if(!ball) return;
  const r=9;
  ctx.save();ctx.globalAlpha=0.28;
  ctx.beginPath();ctx.ellipse(ball.x+3,ball.y+4,r*0.9,r*0.5,0,0,Math.PI*2);
  ctx.fillStyle='#000';ctx.fill();ctx.restore();
  const grad=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,r);
  grad.addColorStop(0,'#ffffff');grad.addColorStop(1,'#c0d0c8');
  ctx.beginPath();ctx.arc(ball.x,ball.y,r,0,Math.PI*2);
  ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1;ctx.stroke();
}

function drawAimLine(){
  if(!dragStart||!dragNow||!ball) return;
  const dx=dragNow.x-dragStart.x,dy=dragNow.y-dragStart.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<3) return;
  const nx=dx/dist,ny=dy/dist;
  const power=Math.min(dist,MAX_DRAG)/MAX_DRAG;
  const lineLen=60+power*80;
  ctx.save();
  ctx.strokeStyle='rgba(200,160,64,0.7)';ctx.lineWidth=2;ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+nx*lineLen,ball.y+ny*lineLen);ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(dragNow.x,dragNow.y);ctx.stroke();
  const angle=Math.atan2(ny,nx);
  const ex=ball.x+nx*lineLen,ey=ball.y+ny*lineLen;
  ctx.fillStyle='rgba(200,160,64,0.8)';
  ctx.beginPath();ctx.moveTo(ex,ey);
  ctx.lineTo(ex-12*Math.cos(angle-0.35),ey-12*Math.sin(angle-0.35));
  ctx.lineTo(ex-12*Math.cos(angle+0.35),ey-12*Math.sin(angle+0.35));
  ctx.closePath();ctx.fill();
  ctx.restore();
}

function showCupIn(){
  const el=document.getElementById('cupIn');
  el.classList.add('show');
  el.onclick=()=>{el.classList.remove('show');resetBall();};
}

function resetBall(){
  ball=null;trail=[];rolling=false;phase='place';
  dragging=false;dragStart=null;dragNow=null;
  document.getElementById('powerFill').style.width='0%';
  document.getElementById('powerVal').textContent='---';
  setStatus('ready','グリーンをタップしてボールを置いてください');
}

function resetAll(){ resetBall(); }

function randomCup(){
  const cx=GX+GW/2,cy=GY+GH/2;
  let x,y,dx,dy;
  do{
    x=GX+GW*0.2+Math.random()*GW*0.6;
    y=GY+GH*0.2+Math.random()*GH*0.6;
    dx=(x-cx)/(GW/2);dy=(y-cy)/(GH/2);
  }while(dx*dx+dy*dy>0.5);
  cup={x,y};resetBall();
}

function setStatus(type,text){
  const badge=document.getElementById('statusBadge');
  document.getElementById('statusText').textContent=text;
  const map={ready:['READY','badge-ready'],aim:['AIM','badge-aim'],roll:['ROLL','badge-roll'],out:['OUT','badge-out']};
  const [label,cls]=map[type]||['READY','badge-ready'];
  badge.textContent=label;badge.className='status-badge '+cls;
}

window.addEventListener('load',()=>{
  resize();
  setStatus('ready','グリーンをタップしてボールを置いてください');
  requestAnimationFrame(draw);
});
</script>
</body>
</html>
