<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⛳ Green Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink:    #080f09;
  --green:  #2a6e3f;
  --gold:   #c8a040;
  --sky:    #6ab8d4;
  --danger: #d84040;
  --safe:   #48b888;
  --white:  #e8f0eb;
  --muted:  #607870;
  --panel:  rgba(6,14,8,0.95);
  --border: rgba(200,160,64,0.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
body { font-family: 'Noto Sans JP', sans-serif; color: var(--white); display: flex; flex-direction: column; align-items: center; }

header {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  background: var(--panel); z-index: 10; flex-shrink: 0;
}
.logo { font-family:'Teko',sans-serif; font-size:22px; letter-spacing:3px; color:var(--gold); }
.hole-info { font-size:11px; color:var(--muted); text-align:right; line-height:1.5; }

#canvas { display: block; touch-action: none; flex-shrink: 0; }

.slope-bar {
  width: 100%; display: flex; gap: 6px; padding: 8px 12px;
  background: var(--panel); border-bottom: 1px solid var(--border);
  flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
}
.slope-bar::-webkit-scrollbar { display: none; }
.slope-btn {
  flex-shrink: 0; padding: 5px 12px; border: 1px solid var(--border);
  border-radius: 20px; background: none; color: var(--muted);
  font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.slope-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(200,160,64,0.1); }

.bottom {
  width: 100%; flex: 1; display: flex; flex-direction: column;
  justify-content: space-between; padding: 10px 14px 14px;
  background: var(--panel); border-top: 1px solid var(--border); gap: 10px; overflow: hidden;
}

.status-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.status-text { font-size: 12px; color: var(--muted); line-height: 1.4; flex: 1; }
.status-badge {
  font-family: 'Teko', sans-serif; font-size: 15px; padding: 3px 12px;
  border-radius: 20px; letter-spacing: 1px; flex-shrink: 0;
}
.badge-ready { background: rgba(72,184,136,0.15); color: var(--safe);   border: 1px solid rgba(72,184,136,0.3); }
.badge-roll  { background: rgba(200,160,64,0.15);  color: var(--gold);  border: 1px solid rgba(200,160,64,0.3); }
.badge-out   { background: rgba(216,64,64,0.15);   color: var(--danger);border: 1px solid rgba(216,64,64,0.3); }

.power-wrap { display: flex; flex-direction: column; gap: 6px; }
.power-header { display: flex; justify-content: space-between; align-items: center; }
.power-label { font-size: 11px; color: var(--muted); }
.power-val { font-family:'Teko',sans-serif; font-size:18px; color: var(--gold); }
.power-track {
  width: 100%; height: 8px; background: rgba(255,255,255,0.07);
  border-radius: 4px; overflow: hidden;
}
.power-fill {
  height: 100%; border-radius: 4px; width: 40%;
  background: linear-gradient(90deg, var(--safe), var(--gold), var(--danger));
  transition: width 0.05s;
}
input[type=range]#powerSlider {
  width: 100%; accent-color: var(--gold); height: 4px; margin-top: 2px;
}

.putt-btn {
  width: 100%; padding: 14px;
  border: none; border-radius: 12px;
  font-family: 'Noto Sans JP', sans-serif; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all 0.1s;
  background: var(--green); color: #fff;
  user-select: none; -webkit-user-select: none;
}
.putt-btn:active { transform: scale(0.97); background: #1e5230; }
.putt-btn.charging {
  background: linear-gradient(90deg, #1e5230, var(--green));
  animation: charge 0.3s ease infinite alternate;
}
@keyframes charge { from{filter:brightness(1)} to{filter:brightness(1.3)} }

.btn-row { display: flex; gap: 8px; }
.btn-sm {
  flex: 1; padding: 9px; border-radius: 10px;
  font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 700;
  cursor: pointer; background: rgba(255,255,255,0.06); color: var(--muted);
  border: 1px solid var(--border);
}

#motionBtn {
  display: none; width: 100%; padding: 9px;
  background: #1a3a8a; color: #fff;
  border: 1px solid rgba(100,150,255,0.4); border-radius: 10px;
  font-family: 'Noto Sans JP', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer;
}

#cupIn {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.75); z-index: 100;
  align-items: center; justify-content: center; flex-direction: column; gap: 16px;
}
#cupIn.show { display: flex; }
.cupin-emoji { font-size: 72px; animation: bounce 0.4s ease infinite alternate; }
@keyframes bounce { from{transform:scale(1)} to{transform:scale(1.15)} }
.cupin-text { font-family:'Teko',sans-serif; font-size:36px; letter-spacing:4px; color:var(--gold); }
.cupin-sub { font-size:13px; color:var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">⛳ GREEN SIM</div>
  <div class="hole-info" id="holeInfo">傾斜を選んでボールを置いてください</div>
</header>

<div class="slope-bar" id="slopeBar"></div>

<canvas id="canvas"></canvas>

<div class="bottom">
  <div class="status-row">
    <div class="status-text" id="statusText">①傾斜を選ぶ　②グリーンをタップしてボール配置</div>
    <div class="status-badge badge-ready" id="statusBadge">READY</div>
  </div>

  <div class="power-wrap">
    <div class="power-header">
      <span class="power-label">打つ強さ</span>
      <span class="power-val" id="powerVal">弱め</span>
    </div>
    <input type="range" id="powerSlider" min="1" max="10" value="4" oninput="onPowerChange()">
    <div class="power-track"><div class="power-fill" id="powerFill"></div></div>
  </div>

  <button class="putt-btn" id="puttBtn"
    ontouchstart="onPuttStart(event)" ontouchend="onPuttEnd(event)"
    onmousedown="onPuttStart(event)" onmouseup="onPuttEnd(event)">
    🏌️ パット！（長押しで強くなる）
  </button>

  <button id="motionBtn" onclick="requestMotion()">📱 スイング検知を有効にする（iPhone）</button>

  <div class="btn-row">
    <button class="btn-sm" onclick="resetBall()">🔄 リセット</button>
    <button class="btn-sm" onclick="randomCup()">📍 ピン移動</button>
  </div>
</div>

<div id="cupIn">
  <div class="cupin-emoji">⛳</div>
  <div class="cupin-text">HOLE IN !</div>
  <div class="cupin-sub">タップして続ける</div>
</div>

<script>
const SLOPES = [
  { label:'フラット',     sx:0,      sy:0      },
  { label:'奥→手前↓',   sx:0,      sy:0.020  },
  { label:'手前→奥↑',   sx:0,      sy:-0.020 },
  { label:'左→右→',     sx:-0.018, sy:0      },
  { label:'右→左←',     sx:0.018,  sy:0      },
  { label:'左奥↘',       sx:-0.014, sy:0.014  },
  { label:'右奥↙',       sx:0.014,  sy:0.014  },
  { label:'複合（難）',   sx:-0.012, sy:0.018  },
];

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

let W, H, GW, GH, GX, GY;
let slopeX = 0, slopeY = 0, slopeIdx = 0;
let ball = null, cup = null;
let rolling = false, phase = 'place';
let power = 4;

let puttPressStart = 0;
let pressingMotion = false;
let lastAX = 0, lastAY = 0;
let motionActive = false;

function resize(){
  const dpr = window.devicePixelRatio || 1;
  const headerH = document.querySelector('header').offsetHeight;
  const slopeH  = document.querySelector('.slope-bar').offsetHeight;
  const bottomH = document.querySelector('.bottom').offsetHeight;
  const canvasH = window.innerHeight - headerH - slopeH - bottomH;
  const canvasW = window.innerWidth;
  canvas.style.width  = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  canvas.width  = canvasW * dpr;
  canvas.height = canvasH * dpr;
  ctx.scale(dpr, dpr);
  W = canvasW; H = canvasH;
  const pad = Math.min(W, H) * 0.08;
  GX = pad; GY = pad; GW = W - pad*2; GH = H - pad*2;
  if(!cup) cup = { x: GX+GW*0.5, y: GY+GH*0.25 };
}
window.addEventListener('resize', resize);

(function(){
  const bar = document.getElementById('slopeBar');
  SLOPES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'slope-btn' + (i === 0 ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => {
      document.querySelectorAll('.slope-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      slopeIdx = i; slopeX = s.sx; slopeY = s.sy;
      resetBall();
      document.getElementById('holeInfo').textContent = '傾斜: ' + s.label;
    };
    bar.appendChild(btn);
  });
})();

function onPowerChange(){
  power = parseInt(document.getElementById('powerSlider').value);
  const labels = ['','超弱','弱め','弱め','普通','普通','強め','強め','強い','超強','MAX'];
  document.getElementById('powerVal').textContent = labels[power];
  document.getElementById('powerFill').style.width = (power * 10) + '%';
}
onPowerChange();

function onPuttStart(e){
  e.preventDefault();
  if(!ball || rolling || phase !== 'ready') return;
  puttPressStart = Date.now();
  document.getElementById('puttBtn').classList.add('charging');
  document.getElementById('puttBtn').textContent = '🏌️ 離して発射！';
  pressingMotion = true;
}

function onPuttEnd(e){
  e.preventDefault();
  if(!ball || rolling) return;
  pressingMotion = false;
  const holdMs = Date.now() - puttPressStart;
  const btn = document.getElementById('puttBtn');
  btn.classList.remove('charging');
  btn.textContent = '🏌️ パット！（長押しで強くなる）';
  if(phase !== 'ready') return;
  const holdBoost = Math.min(holdMs / 1500, 1.0);
  const basePower = power / 10;
  const finalPower = (basePower * 0.6 + holdBoost * 0.4) * 1.8;
  const dx = cup.x - ball.x, dy = cup.y - ball.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  startRoll((dx/dist) * finalPower, (dy/dist) * finalPower);
}

let lastTime = 0;
function rollStep(ts){
  if(!rolling || !ball) return;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  const friction = 0.985;
  ball.vx = (ball.vx + slopeX * 9.8 * dt) * friction;
  ball.vy = (ball.vy + slopeY * 9.8 * dt) * friction;
  ball.x += ball.vx * 55 * dt;
  ball.y += ball.vy * 55 * dt;
  if(cup){
    const dx = ball.x - cup.x, dy = ball.y - cup.y;
    if(Math.sqrt(dx*dx+dy*dy) < 11){ rolling=false; phase='done'; showCupIn(); return; }
  }
  const gcx=GX+GW/2, gcy=GY+GH/2;
  const ex=(ball.x-gcx)/(GW/2), ey=(ball.y-gcy)/(GH/2);
  if(ex*ex+ey*ey > 1.05){ rolling=false; phase='done'; setStatus('out','グリーンを外れました！リセットして再挑戦'); return; }
  const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
  if(speed < 0.015){ rolling=false; phase='done'; setStatus('out','届きませんでした。強さを上げてみて！'); return; }
  requestAnimationFrame(rollStep);
}

function startRoll(vx, vy){
  if(!ball || rolling) return;
  ball.vx=vx; ball.vy=vy; rolling=true; phase='rolling';
  setStatus('roll','転がり中...');
  lastTime=performance.now();
  requestAnimationFrame(rollStep);
}

canvas.addEventListener('pointerdown', e => {
  if(rolling) return;
  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  const cx=GX+GW/2, cy=GY+GH/2;
  const dx=(x-cx)/(GW/2), dy=(y-cy)/(GH/2);
  if(dx*dx+dy*dy > 0.92) return;
  ball={x,y,vx:0,vy:0}; phase='ready';
  setStatus('ready','強さを調整して「パット！」を長押し → 離して発射');
});

function startMotion(){
  motionActive=true;
  window.addEventListener('devicemotion', onMotion);
}

function onMotion(e){
  if(!pressingMotion||!ball||rolling||phase!=='ready') return;
  const a=e.accelerationIncludingGravity||e.acceleration;
  if(!a) return;
  const ax=a.x||0, ay=a.y||0;
  const dax=ax-lastAX, day=ay-lastAY;
  lastAX=ax; lastAY=ay;
  const mag=Math.sqrt(dax*dax+day*day);
  if(mag > 1.5){
    pressingMotion=false;
    const btn=document.getElementById('puttBtn');
    btn.classList.remove('charging');
    btn.textContent='🏌️ パット！（長押しで強くなる）';
    const basePower=power/10;
    const finalPower=basePower*1.5+mag*0.08;
    const nx=dax/(mag+0.001), ny=day/(mag+0.001);
    startRoll(-nx*finalPower, -ny*finalPower);
  }
}

function requestMotion(){
  if(typeof DeviceMotionEvent.requestPermission==='function'){
    DeviceMotionEvent.requestPermission().then(state=>{
      if(state==='granted'){ document.getElementById('motionBtn').style.display='none'; startMotion(); }
    }).catch(console.error);
  } else {
    document.getElementById('motionBtn').style.display='none'; startMotion();
  }
}

function initMotion(){
  if(typeof DeviceMotionEvent!=='undefined'){
    if(typeof DeviceMotionEvent.requestPermission==='function'){
      document.getElementById('motionBtn').style.display='block';
    } else { startMotion(); }
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a140c'; ctx.fillRect(0,0,W,H);
  drawGreen(); drawSlopeArrows(); drawCup();
  if(ball) drawBall();
  requestAnimationFrame(draw);
}

function drawGreen(){
  const cx=GX+GW/2, cy=GY+GH/2, rx=GW/2, ry=GH/2;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=20; ctx.shadowOffsetY=8;
  const grad=ctx.createRadialGradient(cx,cy-ry*0.2,0,cx,cy,Math.max(rx,ry));
  grad.addColorStop(0,'#3a9055'); grad.addColorStop(0.6,'#2d7a44'); grad.addColorStop(1,'#1e5230');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.clip();
  for(let x=GX;x<GX+GW;x+=14){
    ctx.strokeStyle='rgba(255,255,255,0.025)'; ctx.lineWidth=7;
    ctx.beginPath(); ctx.moveTo(x,GY); ctx.lineTo(x,GY+GH); ctx.stroke();
  }
  ctx.restore();
}

function drawSlopeArrows(){
  if(slopeX===0&&slopeY===0) return;
  const cx=GX+GW/2, cy=GY+GH/2;
  const mag=Math.sqrt(slopeX*slopeX+slopeY*slopeY);
  const nx=slopeX/mag, ny=slopeY/mag;
  const step=55;
  for(let c=0;c*step<GW+step;c++){
    for(let r=0;r*step<GH+step;r++){
      const ax=GX+c*step+step/2, ay=GY+r*step+step/2;
      const dx=(ax-cx)/(GW/2), dy=(ay-cy)/(GH/2);
      if(dx*dx+dy*dy>0.82) continue;
      const len=16, ex=ax+nx*len, ey=ay+ny*len;
      ctx.save(); ctx.globalAlpha=0.22; ctx.strokeStyle='#fff'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ex,ey); ctx.stroke();
      const angle=Math.atan2(ey-ay,ex-ax);
      ctx.beginPath();
      ctx.moveTo(ex,ey);
      ctx.lineTo(ex-6*Math.cos(angle-0.4),ey-6*Math.sin(angle-0.4));
      ctx.lineTo(ex-6*Math.cos(angle+0.4),ey-6*Math.sin(angle+0.4));
      ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill();
      ctx.restore();
    }
  }
}

function drawCup(){
  if(!cup) return;
  ctx.save();
  ctx.beginPath(); ctx.arc(cup.x,cup.y,11,0,Math.PI*2);
  ctx.fillStyle='#050c07'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.strokeStyle='#e8f0eb'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cup.x,cup.y); ctx.lineTo(cup.x,cup.y-30); ctx.stroke();
  ctx.fillStyle='#d84040';
  ctx.beginPath(); ctx.moveTo(cup.x,cup.y-30); ctx.lineTo(cup.x+15,cup.y-23); ctx.lineTo(cup.x,cup.y-16); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBall(){
  if(!ball) return;
  const r=9;
  ctx.save(); ctx.globalAlpha=0.25;
  ctx.beginPath(); ctx.ellipse(ball.x+3,ball.y+4,r*0.9,r*0.5,0,0,Math.PI*2);
  ctx.fillStyle='#000'; ctx.fill(); ctx.restore();
  const grad=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,r);
  grad.addColorStop(0,'#ffffff'); grad.addColorStop(1,'#c8d8cc');
  ctx.beginPath(); ctx.arc(ball.x,ball.y,r,0,Math.PI*2);
  ctx.fillStyle=grad; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1; ctx.stroke();
}

function showCupIn(){
  const el=document.getElementById('cupIn');
  el.classList.add('show');
  el.onclick=()=>{ el.classList.remove('show'); resetBall(); };
}

function resetBall(){
  ball=null; rolling=false; phase='place';
  setStatus('ready','①傾斜を選ぶ　②グリーンをタップしてボール配置');
}

function randomCup(){
  const margin=0.25;
  const cx=GX+GW/2, cy=GY+GH/2;
  let x,y,dx,dy;
  do {
    x=GX+GW*margin+Math.random()*GW*(1-margin*2);
    y=GY+GH*margin+Math.random()*GH*(1-margin*2);
    dx=(x-cx)/(GW/2); dy=(y-cy)/(GH/2);
  } while(dx*dx+dy*dy>0.55);
  cup={x,y}; resetBall();
}

function setStatus(type,text){
  const badge=document.getElementById('statusBadge');
  document.getElementById('statusText').textContent=text;
  const map={ready:['READY','badge-ready'],roll:['ROLLING','badge-roll'],out:['OUT','badge-out']};
  const [label,cls]=map[type]||['READY','badge-ready'];
  badge.textContent=label; badge.className='status-badge '+cls;
}

window.addEventListener('load',()=>{
  resize(); initMotion(); requestAnimationFrame(draw);
});
</script>
</body>
</html>
