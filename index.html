<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>⛳ Golf Wind</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: #0e1a12;
  color: #e8f0eb;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  gap: 20px;
}
h1 {
  font-family: 'Teko', sans-serif;
  font-size: 32px;
  letter-spacing: 4px;
  color: #d4a843;
}
#gpsBtn {
  width: 100%;
  max-width: 340px;
  padding: 18px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 18px;
  font-weight: 700;
  background: #2d9955;
  color: #fff;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}
#gpsBtn:hover   { background: #38b869; }
#gpsBtn:active  { transform: scale(0.97); }
#gpsBtn:disabled { background: #1a4028; color: #5a7a64; cursor: default; }

#sensorBtn {
  display: none;
  width: 100%;
  max-width: 340px;
  padding: 12px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  font-weight: 700;
  background: #1a3a8a;
  color: #fff;
  border: 1px solid rgba(100,150,255,0.4);
  border-radius: 10px;
  cursor: pointer;
}

#status {
  font-size: 13px;
  color: #7a9a84;
  min-height: 20px;
  text-align: center;
}

#result {
  display: none;
  width: 100%;
  max-width: 340px;
  background: rgba(8,20,13,0.95);
  border: 1px solid rgba(212,168,67,0.3);
  border-radius: 16px;
  padding: 24px;
  gap: 18px;
  flex-direction: column;
}
#result.show { display: flex; }

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding-bottom: 14px;
}
.row:last-child { border-bottom: none; padding-bottom: 0; }
.row-label { font-size: 11px; letter-spacing: 1.5px; color: #7a9a84; flex-shrink: 0; }
.row-value { font-family: 'Teko', sans-serif; font-size: 36px; line-height: 1; color: #e8f0eb; text-align: right; }
.row-unit  { font-family: 'Noto Sans JP', sans-serif; font-size: 12px; color: #7a9a84; margin-left: 4px; }

/* コンパスエリア */
.compass-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 4px 0;
}
.compass-label { font-size: 11px; letter-spacing: 1.5px; color: #7a9a84; }

/* 風テキスト表示 */
.wind-text {
  font-family: 'Teko', sans-serif;
  font-size: 28px;
  color: #7ec8e3;
  letter-spacing: 2px;
  text-align: center;
}

.compass-outer {
  width: 180px;
  height: 180px;
  filter: drop-shadow(0 0 10px rgba(212,168,67,0.2));
}
#compassSvg { width: 100%; height: 100%; }

/* センサー状態 */
.sensor-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 11px;
  color: #7a9a84;
}
.sensor-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #3a5a44;
  flex-shrink: 0;
}
.sensor-dot.active { background: #52c8a0; animation: pulse 1.5s infinite; }
.sensor-dot.warn   { background: #e0a040; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* カウントダウン */
#countdown {
  font-family: 'Teko', sans-serif;
  font-size: 13px;
  color: #e0a040;
  min-width: 30px;
}

#windBadge {
  display: inline-block;
  font-size: 13px;
  font-weight: 700;
  padding: 5px 14px;
  border-radius: 20px;
}
.calm  { background: rgba(124,200,227,0.2); color: #7ec8e3; border: 1px solid rgba(124,200,227,0.4); }
.cross { background: rgba(224,160,64,0.2);  color: #e0a040; border: 1px solid rgba(224,160,64,0.4); }
.head  { background: rgba(224,82,82,0.2);   color: #e05252; border: 1px solid rgba(224,82,82,0.4); }

footer { font-size: 10px; color: rgba(255,255,255,0.15); letter-spacing: 1px; }
</style>
</head>
<body>

<h1>⛳ GOLF WIND</h1>

<button id="gpsBtn" onclick="getWind()">📍 現在地の風を取得</button>
<button id="sensorBtn" onclick="requestSensor()">🧭 コンパスを有効にする（iPhone）</button>

<div id="status">ボタンを押すと現在地の風情報を表示します</div>

<div id="result">

  <!-- 現在地 -->
  <div class="row">
    <span class="row-label">現在地</span>
    <span class="row-value" id="valPlace" style="font-size:18px;text-align:right">--</span>
  </div>

  <!-- 標高 -->
  <div class="row">
    <span class="row-label">標高</span>
    <span><span class="row-value" id="valElev">--</span><span class="row-unit">m</span></span>
  </div>

  <!-- 気温 -->
  <div class="row">
    <span class="row-label">気温</span>
    <span><span class="row-value" id="valTemp">--</span><span class="row-unit">°C</span></span>
  </div>

  <!-- コンパス -->
  <div class="compass-section">
    <div class="compass-label">風向き</div>

    <!-- 風テキスト（南 3.0 m/s スタイル） -->
    <div class="wind-text" id="windText">-- --</div>

    <div class="compass-outer">
      <svg id="compassSvg" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
        <!-- 外枠 -->
        <circle cx="90" cy="90" r="88" fill="#0a1a10" stroke="#d4a843" stroke-width="2"/>
        <circle cx="90" cy="90" r="82" fill="none" stroke="rgba(212,168,67,0.2)" stroke-width="1"/>

        <!-- 回転するローズ -->
        <g id="compassRose">
          <g id="ticks"></g>
    　    <text x="90" y="20"  text-anchor="middle" font-size="11" font-weight="bold" fill="#e05252" font-family="Noto Sans JP,sans-serif">北</text>
          <text x="90" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#e8f0eb" font-family="Noto Sans JP,sans-serif">南</text>
          <text x="14" y="95"  text-anchor="middle" font-size="11" font-weight="bold" fill="#e8f0eb" font-family="Noto Sans JP,sans-serif">西</text>
          <text x="166" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#e8f0eb" font-family="Noto Sans JP,sans-serif">東</text>
          <text x="138" y="38"  text-anchor="middle" font-size="9" fill="#d4a843" font-family="Noto Sans JP,sans-serif">北東</text>
          <text x="38"  y="38"  text-anchor="middle" font-size="9" fill="#d4a843" font-family="Noto Sans JP,sans-serif">北西</text>
          <text x="138" y="152" text-anchor="middle" font-size="9" fill="#d4a843" font-family="Noto Sans JP,sans-serif">南東</text>
          <text x="38"  y="152" text-anchor="middle" font-size="9" fill="#d4a843" font-family="Noto Sans JP,sans-serif">南西</text>
        </g>

        <!-- 内円（固定） -->
        <circle cx="90" cy="90" r="52" fill="rgba(0,0,0,0.5)" stroke="rgba(212,168,67,0.15)" stroke-width="1"/>

        <!-- 風矢印（固定・絶対方向） -->
        <g id="windArrow" style="display:none">
          <!-- 矢印本体 -->
          <line id="arrowLine" x1="90" y1="90" x2="90" y2="50" stroke="#7ec8e3" stroke-width="4" stroke-linecap="round"/>
          <!-- 矢じり -->
          <polygon id="arrowHead" points="90,44 83,60 97,60" fill="#7ec8e3"/>
          <!-- 中心点 -->
          <circle cx="90" cy="90" r="5" fill="#0a1a10" stroke="#7ec8e3" stroke-width="2"/>
        </g>

        <!-- ピンマーカー -->
        <line x1="90" y1="4" x2="90" y2="18" stroke="#ffffff" stroke-width="2"/>
        <polygon points="90,4 102,9 90,14" fill="#e05252"/>
      </svg>
    </div>

    <!-- センサー状態 & カウントダウン -->
    <div class="sensor-row">
      <div class="sensor-dot" id="sensorDot"></div>
      <span id="sensorStatus">ピン方向にスマホを向けてください</span>
      <span id="countdown"></span>
    </div>

    <div id="windBadge" class="calm">--</div>
  </div>

  <!-- 取得時刻 -->
  <div style="text-align:right;font-size:11px;color:#5a7a64" id="valTime"></div>

</div>

<footer>GPS → Open-Meteo / Nominatim → 風情報表示</footer>

<script>
let windDeg    = 0;
let windSpeed  = 0;
let headingDeg = 0;
let sensorTimer   = null;
let countdownTimer = null;
let sensorActive  = false;
const SENSOR_SEC  = 60;

// ===== 目盛り =====
(function(){
  const g = document.getElementById('ticks');
  for(let i=0;i<72;i++){
    const a=i*5, r=a*Math.PI/180;
    const maj=a%90===0, mid=a%45===0;
    const r1=82, r2=maj?68:mid?72:76;
    const x1=90+r1*Math.sin(r), y1=90-r1*Math.cos(r);
    const x2=90+r2*Math.sin(r), y2=90-r2*Math.cos(r);
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);
    l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('stroke', maj?'#d4a843':mid?'rgba(212,168,67,0.5)':'rgba(212,168,67,0.2)');
    l.setAttribute('stroke-width', maj?'2':'1');
    g.appendChild(l);
  }
})();

// ===== コンパス更新 =====
function updateCompass(){
  document.getElementById('compassRose').setAttribute(
    'transform', 'rotate('+(-headingDeg)+',90,90)'
  );
  const relDeg = windDeg - headingDeg;
  // 風矢印：風が吹いていく方向（windDeg+180）をheading補正
  const arrowDeg = (windDeg + 180 - headingDeg + 360) % 360;
  document.getElementById('windArrow').setAttribute(
    'transform', 'rotate('+arrowDeg+',90,90)'
  );
}

// ===== 風矢印の太さを風速で調整 =====
function updateArrowSize(){
  const w = Math.max(3, Math.min(8, windSpeed * 0.8));
  const len = Math.max(30, Math.min(46, 30 + windSpeed * 1.5));
  const tip = 90 - len;
  document.getElementById('arrowLine').setAttribute('stroke-width', w);
  document.getElementById('arrowLine').setAttribute('y2', tip);
  document.getElementById('arrowHead').setAttribute('points',
    `90,${tip-6} ${90-w*1.8},${tip+10} ${90+w*1.8},${tip+10}`
  );
  document.getElementById('windArrow').style.display = windSpeed >= 0.5 ? '' : 'none';
}

// ===== センサー開始 =====
function startSensor(){
  if(sensorActive) return;
  sensorActive = true;
  window.addEventListener('deviceorientationabsolute', onOrientation, true);
  window.addEventListener('deviceorientation', onOrientation, true);

  const dot = document.getElementById('sensorDot');
  dot.className = 'sensor-dot active';

  let sec = SENSOR_SEC;
  document.getElementById('countdown').textContent = sec+'s';

  countdownTimer = setInterval(()=>{
    sec--;
    document.getElementById('countdown').textContent = sec+'s';
    if(sec <= 10){
      dot.className = 'sensor-dot warn';
    }
    if(sec <= 0){
      stopSensor();
    }
  }, 1000);
}

function stopSensor(){
  sensorActive = false;
  window.removeEventListener('deviceorientationabsolute', onOrientation, true);
  window.removeEventListener('deviceorientation', onOrientation, true);
  clearInterval(countdownTimer);
  countdownTimer = null;
  document.getElementById('sensorDot').className = 'sensor-dot';
  document.getElementById('sensorStatus').textContent = '🧭 コンパス停止（再度ボタンで再起動）';
  document.getElementById('countdown').textContent = '';

  // 再起動ボタンを表示
  const sb = document.getElementById('sensorBtn');
  sb.style.display = 'block';
  sb.textContent   = '🧭 コンパスを再起動（60秒）';
}

function onOrientation(e){
  let h = null;
  if(e.webkitCompassHeading !== undefined){
    h = e.webkitCompassHeading;
  } else if(e.absolute && e.alpha !== null){
    h = (360 - e.alpha) % 360;
  } else if(e.alpha !== null){
    h = (360 - e.alpha) % 360;
  }
  if(h === null) return;
  headingDeg = h;
  updateCompass();
  document.getElementById('sensorStatus').textContent = 'コンパス動作中 — ピン方向へ向けて';
}

// ===== iPhone許可 =====
function requestSensor(){
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission()
      .then(state=>{
        if(state==='granted'){
          document.getElementById('sensorBtn').style.display='none';
          startSensor();
        } else {
          alert('コンパスの許可が必要です');
        }
      }).catch(console.error);
  } else {
    document.getElementById('sensorBtn').style.display='none';
    startSensor();
  }
}

// ===== GPS & 風取得 =====
async function getWind(){
  const btn    = document.getElementById('gpsBtn');
  const status = document.getElementById('status');
  if(!navigator.geolocation){
    status.textContent='⚠️ このブラウザはGPSに対応していません'; return;
  }
  btn.disabled=true;
  btn.textContent='📍 GPS取得中...';
  status.textContent='現在地を確認しています';

  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude, lon=pos.coords.longitude;
    status.textContent='📡 情報を取得中...';
    try{
      const weatherUrl='https://api.open-meteo.com/v1/forecast'
        +'?latitude='+lat+'&longitude='+lon
        +'&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m'
        +'&wind_speed_unit=ms&timezone=Asia%2FTokyo';
      const geoUrl='https://nominatim.openstreetmap.org/reverse'
        +'?lat='+lat+'&lon='+lon+'&format=json&accept-language=ja';

      const [wRes,gRes]=await Promise.all([
        fetch(weatherUrl),
        fetch(geoUrl,{headers:{'Accept-Language':'ja'}})
      ]);
      const weather=await wRes.json();
      const geo=await gRes.json();
      const c=weather.current;

      // 標高（Open-Meteoのelevationフィールド）
      const elev = weather.elevation !== undefined ? Math.round(weather.elevation) : '--';

      const addr=geo.address||{};
      const place=(addr.city||addr.town||addr.village||addr.county||'')
                 +(addr.suburb||addr.neighbourhood||addr.quarter||'');

      document.getElementById('valPlace').textContent=place||'取得できませんでした';
      document.getElementById('valElev').textContent=elev;

      showResult(c.wind_speed_10m, c.wind_gusts_10m, c.wind_direction_10m, c.temperature_2m);
      status.textContent='✅ 取得完了';
    }catch(e){
      status.textContent='⚠️ 取得に失敗しました: '+e.message;
    }
    btn.disabled=false;
    btn.textContent='🔄 再取得';
  }, err=>{
    status.textContent='⚠️ GPS取得失敗: '+err.message;
    btn.disabled=false;
    btn.textContent='📍 現在地の風を取得';
  },{enableHighAccuracy:true,timeout:10000});
}

function showResult(speed, gust, deg, temp){
  windSpeed = speed;
  windDeg   = deg;

  document.getElementById('valTemp').textContent=temp.toFixed(1);
  document.getElementById('valTime').textContent='取得: '+new Date().toLocaleTimeString('ja-JP');

  const dirs=['北','北北東','北東','東北東','東','東南東','南東','南南東',
              '南','南南西','南西','西南西','西','西北西','北西','北北西'];
  const name=dirs[Math.round(deg/22.5)%16];

  // 風テキスト表示「南 3.0 m/s」
  document.getElementById('windText').textContent=name+' '+speed.toFixed(1)+' m/s';

  updateCompass();
  updateArrowSize();

  const badge=document.getElementById('windBadge');
  if(speed<1){      badge.textContent='ほぼ無風';       badge.className='calm'; }
  else if(speed<3){ badge.textContent='微風';           badge.className='calm'; }
  else if(speed<6){ badge.textContent='要注意';         badge.className='cross'; }
  else if(speed<10){badge.textContent='強風 — 番手UP';  badge.className='head'; }
  else{             badge.textContent='強風 — 注意';    badge.className='head'; }

  document.getElementById('result').classList.add('show');

  // センサー起動（iPhoneは許可ボタン表示、他は自動）
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    document.getElementById('sensorBtn').style.display='block';
    document.getElementById('sensorBtn').textContent='🧭 コンパスを有効にする（iPhone）';
  } else {
    startSensor();
  }
}
</script>
</body>
</html>
